defaults:
   - datamodule
   - model
   - wandb

# -------- Wandb logging --------
experiment_name: swinmae-clouds-mw2-ps4-aw8-mr0.5-11ch # Define experiment name
tags: swinmae multi-sat pretrain # Define tags for wandb logging
task: pretraining # regression/segmentation/pretraining: this determines which metrics are logged
monitor_metric: val/loss # Monitor metric for early stopping and model checkpointing

# -------- Training details  --------
max_epochs: 50 # Define number of training epochs
seed: 42 # Define experiment seed
devices: 1 # Defines number of GPUs ised for training.
# strategy: ddp_find_unused_parameters_true # Use DDP strategy with unused parameters set to true

# -------- Data details  --------
limit_train_batches: 0.25 # Limits the amount of training data. Selection random and changing across epochs.
limit_val_batches: 0.5 # Limits the amount of validation data. Selection random and changing across epochs.
limit_test_batches: 1.0 # Limits the amount of test data.

